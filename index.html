<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Henriks Garten</title>
    <style>
      html, body {
        margin: 0; height: 100%; background: #2d4a22; overflow: hidden;
        touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game { width: 100%; height: 100%; }
      #hud {
        position: fixed; top: 12px; left: 12px; padding: 5px 10px; z-index: 5;
        font: bold 15px/1.2 "Trebuchet MS", Arial, sans-serif; color: #fff8e6;
        background: rgba(60, 40, 20, 0.7); border: 2px solid #2b1d14; border-radius: 10px;
        cursor: pointer; user-select: none;
      }
      #hud .key {
        display: inline-block; margin-left: 8px; padding: 0 5px; font-size: 12px;
        color: #2b1d14; background: #fff8e6; border-radius: 4px;
      }
      #tools { position: fixed; left: 16px; bottom: 16px; display: flex; gap: 10px; pointer-events: none; }
      .tool {
        display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 4px;
        font: 16px/1.2 "Trebuchet MS", Arial, sans-serif; color: #fff8e6;
        background: rgba(60, 40, 20, 0.7); border: 2px solid #2b1d14; border-radius: 10px;
      }
      .tool img { width: 44px; height: 44px; }
      .tool b {
        display: inline-block; min-width: 14px; padding: 1px 5px; margin-right: 6px; text-align: center;
        color: #2b1d14; background: #fff8e6; border-radius: 5px;
      }
      /* Meldungen: klein und oben am Rand, nicht mitten im Bild */
      #toast {
        position: fixed; top: 12px; left: 50%; transform: translateX(-50%); max-width: 65%; padding: 8px 16px;
        font: bold 18px/1.3 "Trebuchet MS", Arial, sans-serif; color: #fff8e6; text-align: center;
        background: rgba(60, 40, 20, 0.7); border: 1px solid #2b1d14; border-radius: 10px;
        opacity: 0; pointer-events: none;
      }
      #toast .animal { font-size: 14px; }
      #toast.show { animation: toast 3.5s ease forwards; }
      /* Werkzeug-Kiste in der Hütte */
      #chest {
        position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
        background: rgba(20, 14, 8, 0.55); font: 15px/1.3 "Trebuchet MS", Arial, sans-serif; color: #2b1d14;
      }
      #chest.show { display: flex; }
      .chest-box {
        padding: 14px 18px 10px; text-align: center; max-width: 96vw;
        background: #f4dcae; border: 4px solid #6b4224; border-radius: 14px; box-shadow: 0 6px 0 #8a5a30;
      }
      .chest-box h2 { margin: 0 0 12px; font-size: 22px; }
      .chest-items { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
      .chest-item {
        width: 120px; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px;
        border: 3px solid #a8743f; border-radius: 12px; background: #e8c48a; cursor: pointer;
        font: bold 16px "Trebuchet MS", Arial, sans-serif; color: #3a2414; transition: transform 0.12s;
      }
      .chest-item img { width: 72px; height: 72px; object-fit: contain; image-rendering: pixelated; }
      .chest-item small { font-size: 12px; font-weight: normal; }
      .chest-item.carried { border-style: dashed; }
      /* nur die ausgewählte Kachel ist hervorgehoben; der Mauszeiger wählt sie aus (siehe toolChest.js / eventsPanel.js) */
      .chest-item.selected { transform: scale(1.08); border-color: #e8a830; box-shadow: 0 0 0 4px rgba(255, 210, 90, 0.8); }
      .chest-hint { margin: 10px 0 0; font-size: 14px; }
      /* Events am Hauptrechner im Haupthaus */
      #events {
        position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
        background: rgba(20, 14, 8, 0.55); font: 15px/1.3 "Trebuchet MS", Arial, sans-serif; color: #2b1d14;
      }
      #events.show { display: flex; }
      .ev-hearts { margin: -6px 0 12px; font-size: 16px; }
      .heart { color: #e8508a; }
      .ev-item { width: 210px; gap: 6px; }
      .ev-item small { font-size: 13px; line-height: 1.25; }
      .ev-item.off { filter: saturate(0.6); }
      .ev-item.off.selected { transform: scale(1.03); }
      .ev-name { font-size: 18px; }
      .ev-cost { font-size: 17px; }
      .ev-cost.short { color: #c0392b; }
      .ev-status { display: inline-block; padding: 3px 12px; border-radius: 8px; font-size: 15px; }
      .ev-status.go { background: #3f8a3f; color: #fff8e6; }
      .ev-status.on { background: #e8b84a; color: #3a2414; }
      .ev-status.wait { background: #c8a87a; color: #3a2414; }
      .ev-thumb {
        position: relative; width: 180px; height: 96px; overflow: hidden; border-radius: 10px; border: 2px solid #a8743f;
        background: linear-gradient(#bfe4f0 0 30%, #8cc65a 30% 100%);
      }
      .ev-sprite { position: absolute; transform-origin: bottom left; image-rendering: auto; }
      .ev-love { position: absolute; color: #ff6fa8; font-size: 22px; text-shadow: 0 0 3px #fff; }
      .ev-love.small { font-size: 15px; }
      /* laufendes Event: Restzeit oben links unter dem Zähler (die Mitte gehört den Statusmeldungen) */
      #event-banner {
        position: fixed; top: 50px; left: 12px; z-index: 5; display: none;
        padding: 5px 14px; font: bold 15px/1.2 "Trebuchet MS", Arial, sans-serif; color: #fff8e6;
        background: rgba(200, 80, 130, 0.85); border: 2px solid #2b1d14; border-radius: 10px; pointer-events: none;
      }
      #event-banner.show { display: block; }
      /* Weltkarte für die Schnellreise (am Auto) */
      #travel {
        position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
        background: rgba(20, 14, 8, 0.6); font: 15px/1.3 "Trebuchet MS", Arial, sans-serif; color: #2b1d14;
      }
      #travel.show { display: flex; }
      .travel-box { width: min(98vw, calc(92vh * 1024 / 572)); text-align: center; }
      .travel-map {
        position: relative; width: 100%; aspect-ratio: 1024 / 572; border-radius: 12px;
        background: url(assets/worldmap.jpg) center / 100% 100%; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      }
      .travel-map .place {
        position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center;
        padding: 3px 6px 4px; border: 3px solid #6b4224; border-radius: 12px; background: rgba(244, 220, 174, 0.92);
        font: bold 13px "Trebuchet MS", Arial, sans-serif; color: #3a2414; cursor: pointer; transition: transform 0.12s;
      }
      .travel-map .place small { display: block; font-size: 11px; font-weight: normal; }
      /* alle Schilder gleich groß und quadratisch, das Tierbild mittig im Quadrat */
      .travel-map .place { width: 5.6em; height: 5.6em; justify-content: center; box-sizing: border-box; }
      .animal-box { display: inline-flex; align-items: flex-end; justify-content: center; }
      .travel-map .place:hover, .travel-map .place.selected {
        transform: translate(-50%, -50%) scale(1.15); border-color: #e8a830; box-shadow: 0 0 0 4px rgba(255, 210, 90, 0.8);
      }
      .travel-map .place.here { opacity: 0.75; cursor: default; border-style: dashed; }
      .travel-hint { margin: 6px 0 0; color: #fff8e6; font-size: 16px; text-shadow: 0 1px 2px #000; }
      /* Übersicht (Taste I) */
      #journal {
        position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
        background: rgba(20, 14, 8, 0.55); font: 15px/1.35 "Trebuchet MS", Arial, sans-serif; color: #2b1d14;
      }
      #journal.show { display: flex; }
      .journal-box {
        width: min(960px, 94vw); max-height: 90vh; overflow-y: auto; padding: 14px 18px;
        touch-action: pan-y; -webkit-overflow-scrolling: touch; /* auf dem Tablet wischen zum Scrollen */
        background: #f4dcae; border: 4px solid #6b4224; border-radius: 14px; box-shadow: 0 6px 0 #8a5a30;
      }
      .journal-box h2 { margin: 0 0 10px; font-size: 22px; }
      .journal-box h3 { margin: 14px 0 6px; font-size: 18px; }
      .journal-box .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
      .journal-box .card { padding: 8px; background: #e8c48a; border: 2px solid #a8743f; border-radius: 10px; opacity: 0.75; }
      .journal-box .card.has { opacity: 1; border-color: #4f8a2f; }
      .journal-box .head { display: flex; align-items: center; gap: 8px; }
      .journal-box .head .animal { margin: -6px 0; }
      .journal-box .head b { display: block; font-size: 16px; }
      .journal-box .home { font-weight: bold; color: #3f7a2c; }
      .journal-box .num { font-size: 24px; line-height: 1; vertical-align: -2px; }
      .journal-box h2 .num { font-size: 30px; }
      .journal-box .where { margin-top: 4px; font-size: 13px; color: #6b4224; }
      .journal-box .tools { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
      .journal-box .catch { display: inline-flex; align-items: center; gap: 2px; padding: 1px 6px 1px 2px; background: #f4dcae; border-radius: 8px; font-size: 13px; }
      .journal-box .tool-img { width: 26px; height: 26px; }
      .journal-box .tip { margin-top: 4px; font-size: 13px; font-style: italic; }
      .journal-box .tool-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
      .journal-box .tool-row .tool-img { width: 34px; height: 34px; }
      .journal-box .tool-row b { min-width: 90px; }
      .journal-box .close-hint { margin: 12px 0 0; text-align: center; font-size: 13px; color: #6b4224; }
      #sign {
        position: fixed; right: 16px; bottom: 16px; padding: 10px 16px; min-width: 260px;
        font: 16px/1.6 "Trebuchet MS", Arial, sans-serif; color: #2b1d14;
        background: #e8c48a; border: 3px solid #6b4224; border-radius: 10px;
        box-shadow: 0 4px 0 #8a5a30; pointer-events: none;
        opacity: 0; transform: translateY(10px); transition: opacity 0.2s, transform 0.2s;
      }
      #sign.show { opacity: 1; transform: none; }
      #sign b { display: block; margin-bottom: 4px; font-size: 18px; }
      #sign .print-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; line-height: 1.3; }
      #sign .print-row .print { width: 44px; height: 44px; flex: none; background: #f4dcae; border-radius: 8px; }
      #sign .print-row span { max-width: 280px; }
      #sign .print-row span b { display: block; margin: 0; font-size: 16px; }
      #sign .arrow { display: inline-block; width: 28px; font-weight: bold; font-size: 20px; color: #6b4224; }
      .animal {
        display: inline-block; vertical-align: middle; margin: -0.5em 0;
        background-repeat: no-repeat; image-rendering: auto;
      }
      #hud .count { margin-right: 10px; }
      /* Bewunderungsherzen der Besucher */
      #hud .hearts { display: inline-block; color: #ff8fb8; }
      #hud .hearts b { color: #fff8e6; }
      #hud .hearts.pulse { animation: heart-pulse 0.45s ease-out; }
      @keyframes heart-pulse { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
      /* Touch-Steuerung (nur sichtbar, wenn body.touch) */
      #stick-zone, #btn-action, #btn-reset { display: none; }
      body.touch #stick-zone { display: block; position: fixed; left: 0; top: 0; bottom: 0; width: 50%; }
      #stick {
        position: fixed; width: 130px; height: 130px; margin: -65px 0 0 -65px; border-radius: 50%;
        background: rgba(255, 248, 230, 0.18); border: 3px solid rgba(255, 248, 230, 0.55);
        pointer-events: none; opacity: 0; transition: opacity 0.15s;
      }
      #stick.show { opacity: 1; }
      #stick-knob {
        position: absolute; left: 35px; top: 35px; width: 60px; height: 60px; border-radius: 50%;
        background: rgba(255, 248, 230, 0.75); border: 3px solid #2b1d14;
      }
      body.touch #btn-action {
        display: block; position: fixed; right: 28px; bottom: 28px; width: 110px; height: 110px; border-radius: 50%;
        background: rgba(60, 40, 20, 0.75) center / 70% no-repeat; border: 4px solid #fff8e6;
        box-shadow: 0 5px 0 #2b1d14;
      }
      body.touch #btn-action.pressed { transform: translateY(4px); box-shadow: 0 1px 0 #2b1d14; }
      body.touch #btn-action.empty { opacity: 0.35; }
      /* Werkzeug wechseln, solange man reitet (Reittier-Event) */
      #btn-swap { display: none; }
      body.touch.riding #btn-swap {
        display: block; position: fixed; right: 44px; bottom: 156px; width: 74px; height: 74px; border-radius: 50%;
        font: 34px/1 Arial, sans-serif; background: rgba(60, 40, 20, 0.75); border: 3px solid #fff8e6;
        box-shadow: 0 4px 0 #2b1d14;
      }
      body.touch #btn-reset {
        display: block; position: fixed; right: 16px; top: 16px; width: 52px; height: 52px; border-radius: 12px;
        font: bold 28px/1 "Trebuchet MS", Arial, sans-serif; color: #fff8e6;
        background: rgba(60, 40, 20, 0.7); border: 2px solid #2b1d14;
      }
      /* Auf dem Tablet zeigt der Aktionsknopf das Werkzeug; der Wegweiser rückt nach oben */
      body.touch #tools { display: none; }
      body.touch #sign { bottom: auto; top: 84px; }
      body.touch #hud { max-width: calc(100% - 120px); }
      /* Hinweise am Bildschirmrand: in welcher Richtung eine ausgelegte Falle liegt */
      #markers { position: fixed; inset: 0; pointer-events: none; }
      .marker {
        position: absolute; width: 40px; height: 40px; margin: -22px 0 0 -22px; border-radius: 50%;
        background: rgba(60, 40, 20, 0.8) url(assets/trap.png) center / 78% no-repeat;
        border: 3px solid #fff8e6; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        opacity: 0; transition: opacity 0.2s;
      }
      .marker.show { opacity: 1; }
      .marker.elsewhere.show { opacity: 0.55; }
      .marker .pointer {
        position: absolute; left: 50%; top: 50%; width: 0; height: 0; margin: -7px 0 0 -6px;
        transform-origin: 6px 7px;
      }
      .marker .pointer::after {
        content: ''; position: absolute; left: 30px; top: 0;
        border: 7px solid transparent; border-left: 11px solid #fff8e6;
      }
      .marker.caught { border-color: #ffd84a; animation: marker-pulse 0.9s ease-in-out infinite; }
      .marker.caught .pointer::after { border-left-color: #ffd84a; }
      @keyframes marker-pulse { 50% { transform: scale(1.18); } }
      @keyframes toast { 0% { opacity: 0; } 8%, 80% { opacity: 1; } 100% { opacity: 0; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud"></div>
    <div id="tools"></div>
    <div id="toast"></div>
    <div id="sign"></div>
    <div id="journal"></div>
    <div id="travel"></div>
    <div id="chest"></div>
    <div id="events"></div>
    <div id="event-banner"></div>
    <div id="markers"></div>
    <div id="stick-zone"></div>
    <div id="stick"><div id="stick-knob"></div></div>
    <button id="btn-action" aria-label="Aktion"></button>
    <button id="btn-reset" aria-label="Neustart">↺</button>
    <button id="btn-swap" aria-label="Werkzeug wechseln">🧰</button>
    <script>
      // Tablet/Handy schon beim Laden erkennen, damit die Steuerung sofort da ist
      if (matchMedia("(pointer: coarse)").matches || location.search.includes("touch")) document.body.classList.add("touch");
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
