<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>My Little Zoo</title>
    <link rel="preload" as="image" href="assets/logo.png" />
    <style>
      html, body {
        margin: 0; height: 100%; background: #2d4a22; overflow: hidden;
        touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game { width: 100%; height: 100%; }
      #hud {
        position: fixed; top: 12px; left: 12px; padding: 5px 10px; z-index: 5;
        font: bold 15px/1.2 "Trebuchet MS", Arial, sans-serif; color: #fff8e6;
        background: rgba(60, 40, 20, 0.7); border: 2px solid #2b1d14; border-radius: 10px;
        cursor: pointer; user-select: none;
      }
      #hud .key {
        display: inline-block; margin-left: 8px; padding: 1px 8px; font-size: 13px;
        color: #2b1d14; background: #fff8e6; border-radius: 8px; box-shadow: 0 2px 0 #2b1d14;
      }
      #tools { position: fixed; left: 16px; bottom: 16px; display: flex; gap: 10px; pointer-events: none; }
      .tool {
        display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 4px;
        font: 16px/1.2 "Trebuchet MS", Arial, sans-serif; color: #fff8e6;
        background: rgba(60, 40, 20, 0.7); border: 2px solid #2b1d14; border-radius: 10px;
      }
      .tool img { width: 44px; height: 44px; }
      .tool b {
        display: inline-block; min-width: 14px; padding: 1px 5px; margin-right: 6px; text-align: center;
        color: #2b1d14; background: #fff8e6; border-radius: 5px;
      }
      /* Meldungen: klein und oben am Rand, nicht mitten im Bild */
      #toast {
        position: fixed; top: 12px; left: 50%; transform: translateX(-50%); max-width: 65%; padding: 8px 16px;
        font: bold 18px/1.3 "Trebuchet MS", Arial, sans-serif; color: #fff8e6; text-align: center;
        background: rgba(60, 40, 20, 0.7); border: 1px solid #2b1d14; border-radius: 10px;
        opacity: 0; pointer-events: none; box-sizing: border-box;
      }
      #toast .animal { font-size: 14px; }
      /* kleine Bildschirme (Handy): Meldungen etwas kleiner (Position: zwischen Abzeichen und Knöpfen, siehe showToast) */
      @media (max-width: 900px), (max-height: 500px) {
        #toast { padding: 5px 10px; font-size: 13px; }
        #toast .animal { font-size: 10px; }
      }
      #toast.show { animation: toast 6s ease forwards; } /* so lange steht eine Meldung */
      /* Werkzeug-Kiste in der Hütte */
      #chest {
        position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
        background: rgba(20, 14, 8, 0.55); font: 15px/1.3 "Trebuchet MS", Arial, sans-serif; color: #2b1d14;
      }
      #chest.show { display: flex; }
      .chest-box {
        padding: 14px 18px 10px; text-align: center; max-width: 96vw;
        background: #f4dcae; border: 4px solid #6b4224; border-radius: 14px; box-shadow: 0 6px 0 #8a5a30;
      }
      .chest-box h2 { margin: 0 0 12px; font-size: 22px; }
      /* Schließen-Symbol oben rechts in allen Tafeln (bleibt beim Scrollen stehen) */
      .ov-close {
        position: sticky; top: 0; float: right; z-index: 3; margin: -6px -10px 0 8px; width: 34px; height: 34px; padding: 0;
        border: 2px solid #6b4224; border-radius: 50%; background: #fff4dc; color: #6b4224; font: bold 18px/30px Arial, sans-serif;
        cursor: pointer; box-shadow: 0 2px 0 #8a5a30;
      }
      .ov-close:hover { background: #ffe2a8; }
      .chest-items { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
      .chest-item {
        width: 120px; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px;
        border: 3px solid #a8743f; border-radius: 12px; background: #e8c48a; cursor: pointer;
        font: bold 16px "Trebuchet MS", Arial, sans-serif; color: #3a2414; transition: transform 0.12s;
      }
      .chest-item img { width: 72px; height: 72px; object-fit: contain; image-rendering: pixelated; }
      .chest-item small { font-size: 12px; font-weight: normal; }
      .chest-item.carried { border-style: dashed; }
      /* nur die ausgewählte Kachel ist hervorgehoben; der Mauszeiger wählt sie aus (siehe toolChest.js / eventsPanel.js) */
      .chest-item.selected { transform: scale(1.08); border-color: #e8a830; box-shadow: 0 0 0 4px rgba(255, 210, 90, 0.8); }
      .chest-hint { margin: 10px 0 0; font-size: 14px; }
      /* Events am Hauptrechner im Haupthaus */
      #events {
        position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
        background: rgba(20, 14, 8, 0.55); font: 15px/1.3 "Trebuchet MS", Arial, sans-serif; color: #2b1d14;
      }
      #events.show { display: flex; }
      /* auf kleinen Bildschirmen: die Tafel scrollt (Wischen nach oben und unten) */
      .ev-box { max-height: 92vh; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
      .ev-hearts { margin: -6px 0 12px; font-size: 16px; }
      .ev-tabs { display: flex; justify-content: center; gap: 8px; margin: 0 0 12px; }
      .ev-tab {
        padding: 6px 16px; border: 3px solid #a8743f; border-radius: 10px; background: #e8c48a; cursor: pointer;
        font: bold 18px "Trebuchet MS", Arial, sans-serif; color: #3a2414;
      }
      .ev-tab.on { background: #6b4224; border-color: #6b4224; color: #fff8e6; }
      .pen-thumb { display: flex; align-items: center; justify-content: center; gap: 2px; background: linear-gradient(#bfe4f0 0 30%, #8cc65a 30% 100%); }
      .heart { color: #e8508a; }
      .ev-item { width: 210px; gap: 6px; }
      .ev-item small { font-size: 13px; line-height: 1.25; }
      .ev-item.off { filter: saturate(0.6); }
      .ev-item.off.selected { transform: scale(1.03); }
      .ev-name { font-size: 18px; }
      .ev-cost { font-size: 17px; }
      .ev-cost.short { color: #c0392b; }
      .ev-status { display: inline-block; padding: 3px 12px; border-radius: 8px; font-size: 15px; }
      .ev-status.go { background: #3f8a3f; color: #fff8e6; }
      .ev-status.on { background: #e8b84a; color: #3a2414; }
      .ev-status.wait { background: #c8a87a; color: #3a2414; }
      .ev-thumb {
        position: relative; width: 180px; height: 96px; overflow: hidden; border-radius: 10px; border: 2px solid #a8743f;
        background: linear-gradient(#bfe4f0 0 30%, #8cc65a 30% 100%);
      }
      .ev-sprite { position: absolute; transform-origin: bottom left; image-rendering: auto; }
      .ev-love { position: absolute; color: #ff6fa8; font-size: 22px; text-shadow: 0 0 3px #fff; }
      .ev-love.small { font-size: 15px; }
      /* laufendes Event: Restzeit oben links unter dem Zähler (die Mitte gehört den Statusmeldungen) */
      #event-banner {
        position: fixed; top: 50px; left: 12px; z-index: 5; display: none;
        padding: 5px 14px; font: bold 15px/1.2 "Trebuchet MS", Arial, sans-serif; color: #fff8e6;
        background: rgba(200, 80, 130, 0.85); border: 2px solid #2b1d14; border-radius: 10px; pointer-events: none;
      }
      #event-banner.show { display: block; }
      /* Mini-Tutorial: Hinweis unten in der Mitte (bleibt stehen, bis man den Tierpark verlässt) */
      #tip {
        position: fixed; left: 50%; bottom: 16px; z-index: 5; display: none; max-width: min(520px, 60%); transform: translateX(-50%);
        padding: 8px 16px; font: bold 16px/1.3 "Trebuchet MS", Arial, sans-serif; color: #3a2414; text-align: center; pointer-events: none;
        background: #fff3c4; border: 3px solid #e8483f; border-radius: 12px; box-shadow: 0 4px 0 rgba(43, 29, 20, 0.5);
      }
      #tip.show { display: block; }
      body #tip { padding-right: 36px; } /* Platz für das X (auch bei der kleineren Schrift auf dem Handy) */
      /* kleines X oben rechts im Hinweis (der Hinweis selbst lässt Klicks durch, nur das X nicht) */
      #tip .tip-close {
        position: absolute; top: 50%; right: 6px; width: 24px; height: 24px; margin-top: -12px; padding: 0; pointer-events: auto; cursor: pointer;
        border: 2px solid #e8483f; border-radius: 50%; background: #fff; color: #e8483f; font: bold 12px/20px Arial, sans-serif;
      }
      #tip .tip-close:hover { background: #ffe4e0; }
      body.touch #tip { bottom: 12px; max-width: calc(100% - 300px); } /* zwischen Joystick und Aktionsknopf */
      @media (max-width: 600px) { body.touch #tip { bottom: 150px; max-width: 92%; } } /* hochkant: über dem Aktionsknopf */
      @media (max-width: 900px), (max-height: 500px) { #tip { font-size: 13px; padding: 6px 12px; } }
      /* Weltkarte im Mini-Tutorial: hüpfender Pfeil rechts neben dem Ziel und ein Hinweis */
      .travel-map .place > .tut-arrow {
        position: absolute; left: 100%; top: 50%; margin-left: 4px; transform: translateY(-50%); pointer-events: none;
        font: bold 2.2em/1 Arial, sans-serif; color: #e8483f; text-shadow: 0 0 3px #fff, 0 0 3px #fff; animation: tut-bounce 0.8s ease-in-out infinite;
      }
      .travel-map .place > .tut-arrow.left { left: auto; right: 100%; margin: 0 4px 0 0; animation-name: tut-bounce-left; }
      @keyframes tut-bounce { 50% { transform: translate(8px, -50%); } }
      @keyframes tut-bounce-left { 50% { transform: translate(-8px, -50%); } }
      /* der Hinweis liegt auf dem leeren Spruchband unten in der Karte (so passt er auch auf dem Handy ins Bild) */
      .travel-box { position: relative; }
      .travel-hint.tut { position: absolute; left: 0; right: 0; bottom: 3%; margin: 0; z-index: 2; pointer-events: none; }
      .travel-hint .tut-hint {
        display: inline-block; max-width: 70%; padding: 4px 12px; color: #3a2414; text-shadow: none;
        background: #fff3c4; border: 3px solid #e8483f; border-radius: 10px;
      }
      @media (max-width: 900px), (max-height: 500px) { .travel-hint .tut-hint { font-size: 12px; padding: 3px 8px; } }
      /* Weltkarte für die Schnellreise (am Auto) */
      #travel {
        position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
        background: rgba(20, 14, 8, 0.6); font: 15px/1.3 "Trebuchet MS", Arial, sans-serif; color: #2b1d14;
      }
      #travel.show { display: flex; }
      .travel-box { width: min(98vw, calc(92vh * 1024 / 572)); text-align: center; }
      .travel-map {
        position: relative; width: 100%; aspect-ratio: 1024 / 572; border-radius: 12px;
        background: url(assets/worldmap.jpg) center / 100% 100%; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
        container-type: inline-size; /* die Schilder richten ihre Größe nach der Kartenbreite (cqw) */
      }
      .travel-map .place {
        position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center;
        padding: 3px 2px 4px; border: 3px solid #6b4224; border-radius: 12px; background: rgba(244, 220, 174, 0.92);
        font: bold 13px "Trebuchet MS", Arial, sans-serif; color: #3a2414; cursor: pointer; transition: transform 0.12s;
      }
      .travel-map .place > span { font-size: 0.9em; line-height: 1.15; } /* lange Namen wie "Bambuswald" passen hinein */
      .travel-map .place small { display: block; font-size: 0.85em; font-weight: normal; }
      /* Wetterphase der Savanne mit Countdown: gut lesbar unter dem Schild */
      .travel-map .place > .season-tag {
        position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 4px; padding: 2px 8px; pointer-events: none;
        font: bold 1.15em/1.3 "Trebuchet MS", Arial, sans-serif; color: #3a2414; white-space: nowrap;
        background: rgba(255, 248, 230, 0.95); border: 2px solid #6b4224; border-radius: 10px; box-shadow: 0 2px 0 rgba(43, 29, 20, 0.35);
      }
      /* alle Schilder gleich groß und quadratisch, das Tierbild mittig im Quadrat. Sie wachsen und schrumpfen mit der Karte
         (13px Schrift bei großer Karte), sonst überlappen sich auf dem Handy Tierpark, Wiese und Wald */
      .travel-map .place { width: 6.2em; height: 6.2em; justify-content: center; box-sizing: border-box; font-size: clamp(8px, 1.1cqw, 13px); }
      .animal-box { display: inline-flex; align-items: flex-end; justify-content: center; }
      .travel-map .place:hover, .travel-map .place.selected {
        z-index: 1;
        transform: translate(-50%, -50%) scale(1.15); border-color: #e8a830; box-shadow: 0 0 0 4px rgba(255, 210, 90, 0.8);
      }
      .travel-map .place.here { opacity: 0.75; cursor: default; border-style: dashed; }
      .travel-hint { margin: 6px 0 0; color: #fff8e6; font-size: 16px; text-shadow: 0 1px 2px #000; }
      /* Übersicht (Taste I) */
      #journal {
        position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
        background: rgba(20, 14, 8, 0.55); font: 15px/1.35 "Trebuchet MS", Arial, sans-serif; color: #2b1d14;
      }
      #journal.show { display: flex; }
      .journal-box {
        width: min(960px, 94vw); max-height: 90vh; overflow-y: auto; padding: 14px 18px;
        touch-action: pan-y; -webkit-overflow-scrolling: touch; /* auf dem Tablet wischen zum Scrollen */
        background: #f4dcae; border: 4px solid #6b4224; border-radius: 14px; box-shadow: 0 6px 0 #8a5a30;
      }
      .journal-box h2 { margin: 0 0 10px; font-size: 22px; }
      .journal-box h3 { margin: 14px 0 6px; font-size: 18px; }
      .journal-box .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
      .journal-box .card { padding: 8px; background: #e8c48a; border: 2px solid #a8743f; border-radius: 10px; opacity: 0.75; }
      .journal-box .card.has { opacity: 1; border-color: #4f8a2f; }
      .journal-box .head { display: flex; align-items: center; gap: 8px; }
      .journal-box .head .animal { margin: -6px 0; }
      .journal-box .head b { display: block; font-size: 16px; }
      .journal-box .home { font-weight: bold; color: #3f7a2c; }
      .journal-box .num { font-size: 24px; line-height: 1; vertical-align: -2px; }
      .journal-box h2 .num { font-size: 30px; }
      .journal-box .where { margin-top: 4px; font-size: 13px; color: #6b4224; }
      .journal-box .tools { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
      .journal-box .catch { display: inline-flex; align-items: center; gap: 2px; padding: 1px 6px 1px 2px; background: #f4dcae; border-radius: 8px; font-size: 13px; }
      .journal-box .tool-img { width: 26px; height: 26px; }
      .journal-box .tip { margin-top: 4px; font-size: 13px; font-style: italic; }
      .journal-box .tool-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
      .journal-box .tool-row .tool-img { width: 34px; height: 34px; }
      .journal-box .tool-row b { min-width: 90px; }
      /* Steuerung ganz oben in der Übersicht: PC und Tablet nebeneinander (schmal untereinander) */
      .journal-box > h3:first-of-type { margin-top: 0; }
      .journal-box .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 8px; margin-bottom: 14px; }
      .journal-box .ctl-box { padding: 8px 10px; background: #e8c48a; border: 2px solid #a8743f; border-radius: 10px; }
      .journal-box .ctl-box > b { display: block; margin-bottom: 4px; font-size: 16px; }
      .journal-box .ctl-row { display: grid; grid-template-columns: 9.5em 1fr; gap: 8px; padding: 2px 0; font-size: 14px; }
      .journal-box .ctl-keys { font-weight: bold; }
      .journal-box kbd {
        display: inline-block; min-width: 1em; margin: 0 1px; padding: 0 4px; text-align: center;
        font: bold 12px/1.5 "Trebuchet MS", Arial, sans-serif; color: #2b1d14; background: #fff8e6; border: 1px solid #a8743f; border-radius: 4px;
      }
      /* Willkommens-Tafel beim neuen Spiel (gleiche Tafel wie die Übersicht, nur schmaler) */
      .journal-box.intro-box { width: min(760px, 94vw); }
      .intro-goals { margin: 0 0 14px; padding: 0; list-style: none; font-size: 16px; }
      .intro-goals li { display: flex; gap: 10px; padding: 4px 0; }
      .intro-icon { flex: none; width: 1.4em; text-align: center; color: #e8508a; }
      .journal-box .close-hint { margin: 12px 0 0; text-align: center; font-size: 13px; color: #6b4224; }
      #sign {
        position: fixed; right: 16px; bottom: 16px; padding: 10px 16px; min-width: 260px;
        font: 16px/1.6 "Trebuchet MS", Arial, sans-serif; color: #2b1d14;
        background: #e8c48a; border: 3px solid #6b4224; border-radius: 10px;
        box-shadow: 0 4px 0 #8a5a30; pointer-events: none;
        opacity: 0; transform: translateY(10px); transition: opacity 0.2s, transform 0.2s;
      }
      #sign.show { opacity: 1; transform: none; }
      #sign b { display: block; margin-bottom: 4px; font-size: 18px; }
      #sign .print-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; line-height: 1.3; }
      #sign .print-row span { max-width: 280px; }
      #sign .print-row span b { display: block; margin: 0; font-size: 16px; }
      #sign .arrow { display: inline-block; width: 28px; font-weight: bold; font-size: 20px; color: #6b4224; }
      .animal {
        display: inline-block; vertical-align: middle; margin: -0.5em 0;
        background-repeat: no-repeat; image-rendering: auto;
      }
      #hud .count { margin-right: 10px; }
      /* Erfolg: ein Gehege ist voll */
      #success {
        position: fixed; top: 22%; left: 50%; z-index: 15; display: none; flex-direction: column; align-items: center; gap: 4px;
        padding: 12px 22px 10px; transform: translateX(-50%); pointer-events: none; text-align: center;
        font: 16px/1.25 "Trebuchet MS", Arial, sans-serif; color: #3a2414;
        background: #fff3c4; border: 4px solid #e8a830; border-radius: 16px; box-shadow: 0 6px 0 #b8801a, 0 0 24px rgba(255, 210, 90, 0.8);
      }
      #success.show { display: flex; animation: success 3s ease forwards; }
      #success b { font-size: 20px; }
      #success small { font-size: 13px; }
      .success-star { font-size: 40px; line-height: 1; animation: success-star 0.9s ease-out; }
      @keyframes success { 0% { opacity: 0; transform: translateX(-50%) scale(0.6); } 10% { opacity: 1; transform: translateX(-50%) scale(1.08); }
        16% { transform: translateX(-50%) scale(1); } 85% { opacity: 1; } 100% { opacity: 0; transform: translateX(-50%) translateY(-12px); } }
      @keyframes success-star { 0% { transform: scale(0) rotate(-90deg); } 70% { transform: scale(1.3) rotate(10deg); } 100% { transform: scale(1) rotate(0); } }
      .pen-slots { margin-top: 6px; font-size: 14px; }
      /* Übersicht: Herzen je Tierart */
      .hs-list { display: flex; flex-direction: column; gap: 4px; margin: 4px 0 10px; }
      .hs-row { display: grid; grid-template-columns: 34px 120px 1fr 70px; align-items: center; gap: 8px; font-size: 14px; }
      .hs-row b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .hs-bar { height: 12px; border-radius: 6px; background: rgba(107, 66, 36, 0.18); overflow: hidden; }
      .hs-bar span { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #ff8fb8, #e8508a); }
      .hs-num { text-align: right; font-weight: bold; }
      .hs-ice { font-size: 22px; text-align: center; }
      .hs-empty { margin: 2px 0 10px; font-size: 14px; }
      /* Bewunderungsherzen der Besucher */
      #hud .hearts { display: inline-block; color: #ff8fb8; }
      #hud .hearts b { color: #fff8e6; }
      #hud .hearts.pulse { animation: heart-pulse 0.45s ease-out; }
      @keyframes heart-pulse { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
      /* Touch-Steuerung (nur sichtbar, wenn body.touch) */
      #stick-zone, #btn-action, #btn-full { display: none; }
      body.touch #stick-zone { display: block; position: fixed; left: 0; top: 0; bottom: 0; width: 50%; }
      #stick {
        position: fixed; width: 130px; height: 130px; margin: -65px 0 0 -65px; border-radius: 50%;
        background: rgba(255, 248, 230, 0.18); border: 3px solid rgba(255, 248, 230, 0.55);
        pointer-events: none; opacity: 0; transition: opacity 0.15s;
      }
      #stick.show { opacity: 1; }
      #stick-knob {
        position: absolute; left: 35px; top: 35px; width: 60px; height: 60px; border-radius: 50%;
        background: rgba(255, 248, 230, 0.75); border: 3px solid #2b1d14;
      }
      body.touch #btn-action {
        display: block; position: fixed; right: 28px; bottom: 28px; width: 110px; height: 110px; border-radius: 50%;
        background: rgba(60, 40, 20, 0.75) center / 70% no-repeat; border: 4px solid #fff8e6;
        box-shadow: 0 5px 0 #2b1d14;
      }
      body.touch #btn-action.pressed { transform: translateY(4px); box-shadow: 0 1px 0 #2b1d14; }
      body.touch #btn-action.empty { opacity: 0.35; }
      /* Werkzeug wechseln, solange man reitet (Reittier-Event) */
      #btn-swap { display: none; }
      body.touch.riding #btn-swap {
        display: block; position: fixed; right: 44px; bottom: 156px; width: 74px; height: 74px; border-radius: 50%;
        font: 34px/1 Arial, sans-serif; background: rgba(60, 40, 20, 0.75); border: 3px solid #fff8e6;
        box-shadow: 0 4px 0 #2b1d14;
      }
      /* Menü-Knopf oben rechts (auch am PC; dort geht auch Esc) */
      #btn-menu {
        position: fixed; right: 16px; top: 16px; z-index: 5; width: 52px; height: 52px; border-radius: 12px; cursor: pointer;
        font: bold 28px/1 "Trebuchet MS", Arial, sans-serif; color: #fff8e6;
        background: rgba(60, 40, 20, 0.7); border: 2px solid #2b1d14;
      }
      /* Vollbild-Knopf neben dem Menü: an bzw. im Vollbild wieder aus (fehlt, wo es kein Vollbild gibt) */
      body.touch #btn-full {
        display: block; position: fixed; right: 76px; top: 16px; width: 52px; height: 52px; border-radius: 12px;
        font: bold 26px/1 "Trebuchet MS", Arial, sans-serif; color: #fff8e6;
        background: rgba(60, 40, 20, 0.7); border: 2px solid #2b1d14;
      }
      body.touch.no-fullscreen #btn-full { display: none; }
      #btn-full svg { display: block; margin: auto; }
      /* Auf dem Tablet zeigt der Aktionsknopf das Werkzeug; der Wegweiser rückt nach oben */
      body.touch #tools { display: none; }
      body.touch #sign { bottom: auto; top: 84px; }
      body.touch #hud { max-width: calc(100% - 180px); }
      /* Hinweise am Bildschirmrand: in welcher Richtung eine ausgelegte Falle liegt */
      #markers { position: fixed; inset: 0; pointer-events: none; }
      .marker {
        position: absolute; width: 40px; height: 40px; margin: -22px 0 0 -22px; border-radius: 50%;
        background: rgba(60, 40, 20, 0.8) url(assets/trap.png) center / 78% no-repeat;
        border: 3px solid #fff8e6; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        opacity: 0; transition: opacity 0.2s;
      }
      .marker.show { opacity: 1; }
      .marker.elsewhere.show { opacity: 0.55; }
      .marker .pointer {
        position: absolute; left: 50%; top: 50%; width: 0; height: 0; margin: -7px 0 0 -6px;
        transform-origin: 6px 7px;
      }
      .marker .pointer::after {
        content: ''; position: absolute; left: 30px; top: 0;
        border: 7px solid transparent; border-left: 11px solid #fff8e6;
      }
      .marker.caught { border-color: #ffd84a; animation: marker-pulse 0.9s ease-in-out infinite; }
      .marker.caught .pointer::after { border-left-color: #ffd84a; }
      @keyframes marker-pulse { 50% { transform: scale(1.18); } }
      /* Startbildschirm und Menü */
      #start, #menu {
        position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center;
        font: 15px/1.3 "Trebuchet MS", Arial, sans-serif; color: #2b1d14;
      }
      /* Ladeanzeige: beim Start mit Fortschritt, beim Aufbau eines Gebiets mit laufendem Balken (busy) */
      #loading {
        position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center;
        background: var(--bg, none) center / cover #2d4a22; font: 16px/1.35 "Trebuchet MS", Arial, sans-serif; color: #fff8e6;
      }
      #loading.show { display: flex; }
      .loading-box {
        width: min(360px, 80vw); padding: 16px 20px 20px; text-align: center;
        background: rgba(30, 22, 12, 0.72); border-radius: 16px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
      }
      /* Logo (public/assets/logo.png, siehe tools/make-logo.js) auf Lade- und Startbildschirm und im Menü */
      .loading-logo { display: block; width: 100%; max-width: 320px; aspect-ratio: 720 / 396; margin: -46px auto 4px; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.35)); }
      .loading-text { margin: 0 0 14px; }
      .loading-bar { height: 16px; border: 3px solid #6b4224; border-radius: 10px; background: #f4dcae; overflow: hidden; box-shadow: 0 3px 0 #2b1d14; }
      .loading-fill { width: 0; height: 100%; background: #7cc04a; transition: width 0.15s; }
      #loading.busy .loading-fill { width: 35%; animation: loading-run 1.1s ease-in-out infinite; transition: none; }
      .loading-error { margin: 12px 0; font-size: 12px; opacity: 0.8; word-break: break-word; }
      #loading .start-btn { display: block; width: 100%; margin: 8px 0 0; }
      #loading.failed .loading-bar { display: none; }
      @keyframes loading-run { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
      /* Hintergrund von Start- und Ladebildschirm: Bildschirmfoto einer Welt (--bg, siehe Skript unten und src/ui/loading.js) */
      #start { background: var(--bg, none) center / cover #2d4a22; }
      #menu { background: rgba(20, 14, 8, 0.55); }
      #start.show, #menu.show { display: flex; }
      .start-box, .menu-box {
        display: flex; flex-direction: column; align-items: center; gap: 12px; width: min(380px, 92vw);
        max-height: calc(100% - 16px); overflow-y: auto; /* kleine Bildschirme (Handy quer): scrollen statt abschneiden */
        padding: 18px 20px 20px; box-sizing: border-box; text-align: center;
        background: #f4dcae; border: 4px solid #6b4224; border-radius: 16px; box-shadow: 0 6px 0 #8a5a30, 0 8px 24px rgba(0, 0, 0, 0.45);
      }
      .start-logo { display: block; width: 100%; max-width: 330px; margin: -4px auto 0; }
      .menu-logo { display: block; width: 70%; max-width: 230px; margin: -4px auto -6px; }
      .menu-box h2 { margin: 0; }
      .menu-box > .ov-close { align-self: flex-end; margin: -6px -10px -34px 0; } /* oben rechts, nicht mittig über dem Logo */
      .start-btn {
        width: 100%; padding: 12px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px;
        border: 3px solid #a8743f; border-radius: 12px; background: #e8c48a; cursor: pointer;
        font: bold 22px "Trebuchet MS", Arial, sans-serif; color: #3a2414;
      }
      .start-btn:active { transform: translateY(2px); }
      .start-btn small { font-size: 13px; font-weight: normal; }
      .start-btn:disabled { opacity: 0.45; cursor: default; }
      .start-btn.test { background: #d8d0c0; border-color: #8a8070; font-size: 18px; }
      .start-btn.small { font-size: 17px; padding: 8px; }
      .start-btn.danger { background: #e89a7a; border-color: #a8543f; }
      .start-ask { display: none; width: 100%; flex-direction: column; gap: 8px; }
      .start-ask p { margin: 0; font-weight: bold; }
      #start.asking .start-ask { display: flex; }
      #start.asking [data-act="new"] { display: none; }
      .menu-saved { margin: 2px 0 0; font-size: 14px; color: #6b4224; }
      /* Sprachwahl unten auf dem Startbildschirm */
      .start-lang { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
      /* Impressum: kleiner, unauffälliger Link neben den Sprachknöpfen; klappt die Angaben darunter auf */
      .imprint-link {
        margin-left: 6px; padding: 2px; border: none; background: none; cursor: pointer;
        font: 11px "Trebuchet MS", Arial, sans-serif; color: rgba(58, 36, 20, 0.55); text-decoration: underline;
      }
      .imprint-link:hover { color: #3a2414; }
      .start-imprint { display: none; font-size: 12px; line-height: 1.4; color: #6b4224; }
      .start-imprint a { color: inherit; }
      #start.imprint .start-imprint { display: block; }
      /* niedrige Bildschirme (Handy quer): Startbildschirm kompakter, damit alles ins Bild passt */
      @media (max-height: 500px) {
        .start-box { gap: 6px; padding: 10px 16px 10px; }
        .start-logo { max-height: 96px; width: auto; }
        .menu-logo { max-height: 70px; width: auto; }
        .menu-box { gap: 6px; padding: 10px 16px 10px; }
        .menu-box .start-btn { padding: 5px 10px; font-size: 17px; }
        .start-box .start-btn { padding: 5px 10px; font-size: 17px; }
        .start-box .start-btn.test { font-size: 15px; }
      }
      .lang-btn {
        padding: 5px 14px; border: 2px solid #a8743f; border-radius: 10px; background: #e8c48a; cursor: pointer;
        font: bold 15px "Trebuchet MS", Arial, sans-serif; color: #3a2414;
      }
      .lang-btn.on { background: #6b4224; border-color: #6b4224; color: #fff8e6; cursor: default; }
      #hud .test { margin-left: 8px; padding: 0 5px; font-size: 12px; color: #fff8e6; background: #c0392b; border-radius: 4px; }
      @keyframes toast { 0% { opacity: 0; } 8%, 80% { opacity: 1; } 100% { opacity: 0; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <!-- Ladeanzeige (siehe src/ui/loading.js): gleich beim Öffnen der Seite zu sehen -->
    <div id="loading" class="show"><div class="loading-box"><img class="loading-logo" src="assets/logo.png" alt="My Little Zoo"><p class="loading-text">Das Spiel wird geladen …</p><div class="loading-bar"><div class="loading-fill"></div></div></div></div>
    <script>
      // Ladeanzeige gleich in der richtigen Sprache (dieselbe Regel wie in src/i18n.js)
      (function () {
        var l = null;
        try { l = localStorage.getItem("my-little-zoo-lang"); } catch (e) {}
        if (l !== "de" && l !== "en") l = ((navigator.languages && navigator.languages[0]) || navigator.language || "").toLowerCase().indexOf("de") === 0 ? "de" : "en";
        document.documentElement.lang = l;
        if (l === "en") document.querySelector("#loading .loading-text").textContent = "Loading the game …";
        // Hintergrund für Lade- und Startbildschirm: ein Bildschirmfoto aus einer zufälligen Welt
        var bgs = ["meadow", "forest", "savanna", "asia", "reef", "aquarium"];
        document.documentElement.style.setProperty("--bg", "url(assets/bg/bg_" + bgs[Math.floor(Math.random() * bgs.length)] + ".jpg)");
      })();
    </script>
    <div id="hud"></div>
    <div id="tools"></div>
    <div id="toast"></div>
    <div id="sign"></div>
    <div id="journal"></div>
    <div id="travel"></div>
    <div id="chest"></div>
    <div id="events"></div>
    <div id="event-banner"></div>
    <div id="tip"></div>
    <div id="success"></div>
    <div id="markers"></div>
    <div id="menu"></div>
    <div id="start"></div>
    <div id="stick-zone"></div>
    <div id="stick"><div id="stick-knob"></div></div>
    <button id="btn-action" aria-label="Aktion"></button>
    <button id="btn-menu" aria-label="Menü">☰</button>
    <button id="btn-full" aria-label="Vollbild">⛶</button>
    <button id="btn-swap" aria-label="Werkzeug wechseln">🧰</button>
    <script>
      // Tablet/Handy schon beim Laden erkennen, damit die Steuerung sofort da ist
      if (matchMedia("(pointer: coarse)").matches || location.search.includes("touch")) document.body.classList.add("touch");
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
